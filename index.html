<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local-first markdown notes workspace — edit in the browser, store as .md files." />
    <title>Notes Studio</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ns:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var accent = localStorage.getItem('ns:accent');
          if (accent) document.documentElement.setAttribute('data-accent', accent);
          var density = localStorage.getItem('ns:density');
          if (density) document.documentElement.setAttribute('data-density', density);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
